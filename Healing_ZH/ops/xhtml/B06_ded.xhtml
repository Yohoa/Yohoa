<title>治愈创伤幸存者的碎裂自我：克服内在自我疏离</title>

<section epub:type="frontmatter">
<p class="dedication">献给我最杰出的老师们：</p>
<p class="dedication1">所有的创伤幸存者，他们让我得以窥见其内心世界，他们是我的老师，教会我什么话该说、什么话永远不该说，直至今日，仍不断激励我探寻新的方法，帮助他们在破碎之处得到疗愈。</p>
<p class="dedication1">特别感谢芭芭拉·沃森，她教会了我：激励胜于治疗，欢笑胜于哭泣，当所有人都失去希望时，仍要坚守信念。</p>
<p class="dedication1">并将我永恒的感激献给卡米尔，她是我"翅膀下的风"。</p>
</section>
